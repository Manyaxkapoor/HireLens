services:
  # Backend API Service
  - type: web
    name: hirelens-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hirelens-db
          property: connectionString
      - key: PROJECT_NAME
        value: HireLens
      - key: VERSION
        value: 1.0.0
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /health

  # Frontend Service
  - type: web
    name: hirelens-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    dockerCommand: nginx -g 'daemon off;'

databases:
  # PostgreSQL Database
  - name: hirelens-db
    databaseName: hirelens
    plan: free
